<style>
:root{
  --accent:#b5502e; --accent-dark:#8a3c20; --accent-bg:oklch(93% 0.04 45);
  --bg:oklch(98% 0.008 75); --card:oklch(99% 0.004 75); --border:oklch(92% 0.01 60);
  --border-2:oklch(94% 0.008 60); --text:oklch(22% 0.02 50); --text-2:oklch(45% 0.02 50);
  --text-3:oklch(50% 0.015 55); --muted:oklch(60% 0.01 60); --green-bg:oklch(94% 0.05 145);
  --green-fg:oklch(42% 0.1 145); --red:oklch(50% 0.13 30);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Work Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);}
h1,h2,.serif{font-family:'Spectral',Georgia,serif;}
a{color:var(--accent);text-decoration:none;}
input,select,textarea{font-family:'Work Sans',system-ui,sans-serif;font-size:15px;outline:none;border:1px solid var(--border);border-radius:10px;padding:11px 13px;background:var(--card);color:var(--text);width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
button{font-family:inherit;cursor:pointer;}
::-webkit-scrollbar{width:0;height:0;}
.row{display:flex;flex-direction:row;}
.col{display:flex;flex-direction:column;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.06);}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;border:none;background:var(--accent);color:#fffaf6;font-size:15px;font-weight:600;width:100%;}
.btn-secondary{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;background:transparent;color:var(--accent);font-size:15px;font-weight:600;border:1.5px solid var(--accent);width:100%;}
.btn-danger{background:var(--red);color:#fff;border:none;}
.btn-sm{height:34px;font-size:13px;padding:0 12px;border-radius:9px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;display:inline-block;}
.label{font-size:13px;font-weight:600;color:oklch(38% 0.02 50);margin-bottom:5px;display:block;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:oklch(20% 0.02 50);color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;}
.toast.erro{background:oklch(45% 0.15 30);}
.toast.ok{background:oklch(38% 0.09 145);}
.spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 0.7s linear infinite;margin:24px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.topbar{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fffaf6;padding:14px 18px;position:sticky;top:0;z-index:20;}
.topbar h1{margin:0;font-size:19px;font-weight:700;}
.topbar .sub{font-size:11.5px;opacity:.85;}
.icon-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.18);border:none;display:flex;align-items:center;justify-content:center;color:#fffaf6;}
.content{flex:1 1 auto;overflow-y:auto;padding-bottom:14px;}
.bottomnav{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 0 7px;cursor:pointer;color:var(--muted);}
.navitem.active{color:var(--accent);}
.navitem span{font-size:10px;font-weight:600;}
.fab{position:fixed;right:20px;bottom:80px;width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(140,60,20,0.55);border:none;color:#fff;z-index:15;}
.section{padding:20px 18px 24px;}
.backrow{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.backbtn{cursor:pointer;color:var(--text);display:flex;}
.toggle-row{display:flex;gap:8px;}
.toggle-btn{cursor:pointer;flex:1;text-align:center;padding:10px 6px;border-radius:12px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:transparent;color:var(--text-2);}
.toggle-btn.on{background:var(--accent);color:#fffaf6;border-color:var(--accent);}
.pill{cursor:pointer;padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:600;background:transparent;color:var(--text-2);border:none;}
.pill.on{background:var(--accent);color:#fffaf6;}
.list-item{padding:12px 14px;background:var(--card);border-bottom:1px solid var(--border-2);}
.list-item:last-child{border-bottom:none;}
.grouped{border:1px solid var(--border);border-radius:14px;overflow:hidden;}
#tela-login{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 30px 30px;background:var(--bg);}
.err{color:var(--red);font-size:13px;margin-top:6px;}
.avatar{border-radius:50%;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto;}
</style>
</head>

<div id="app-root" style="display:none;">

    <div class="topbar row" style="align-items:center;justify-content:space-between;">

        </button>

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button class="icon-btn" title="Sair" onclick="doLogout()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>

  'Paróquia Nossa Senhora Rosa Mística (Franca-SP)','Paróquia Santa Mônica (Franca-SP)','Paróquia Santa Luzia (Franca-SP)',
  'Paróquia Nossa Senhora das Graças (São Joaquim da Barra-SP)','Paróquia Nossa Senhora Aparecida (São Joaquim da Barra-SP)',
  'Paróquia Nossa Senhora da Abadia (Cristais Paulista-SP)','Paróquia Nossa Senhora Aparecida (Itirapuã-SP)',
  'Paróquia São João Batista (Franca-SP)','Paróquia Santa Cruz (Ribeirão Corrente-SP)','Paróquia Santo Antônio (Aramina-SP)',
  'Paróquia Nossa Senhora do Patrocínio (Buritizal-SP)','Paróquia Santo Antônio (Rifaina-SP)',
  'Paróquia São Sebastião (Jeriquara-SP)','Paróquia Nossa Senhora Aparecida (Pedregulho-SP)'
];
const usuariosPadrao = [
  { usuario: 'admin', senha: 'caritas2026', nivel: 'admin', nome: 'Cáritas - Administrador Diocese', paroquia: '__admin__' }
];

let usuarioAtual = null;
let telaAtual = 'home';
let familias = [], entregas = [], estoques = {}, agentes = [], chatMsgs = [], compartilhamentos = [];
let unsubFam, unsubEnt, unsubEst, unsubChat, unsubAgt, unsubComp;
let familyFilter = 'ativas', buscaFamilia = '';
let selectedFamilyId = null;
let entregaDestino = 'familia', entregaSelFamiliaId = null, entregaOrigemTipo = 'proprio';
let entregaOrigemParoquia = '', entregaDestinoParoquia = '';
let historicoFiltroMes = '';

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function toast(msg, tipo){
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast show ' + (tipo||'');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=> el.classList.remove('show'), 2600);
}
function isAdmin(){ return usuarioAtual && usuarioAtual.nivel === 'admin'; }
function minhaParoquia(){ return usuarioAtual ? usuarioAtual.paroquia : ''; }
function initialsOf(nome){ return (nome||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function fmtData(iso){
  if (!iso) return '—';
  const d = String(iso).slice(0,10).split('-');
  return d.length===3 ? d[2]+'/'+d[1] : iso;
}

/* ================= LOGIN ================= */
(function initLoginSelect(){
  const sel = document.getElementById('login-paroquia');
  sel.innerHTML = '<option value="">Selecione...</option>' +
    '<option value="__admin__">▸ Administração Diocese (Admin)</option>' +
    LISTA_PAROQUIAS.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');
})();

function aoSelecionarParoquia(){
  const paroquia = document.getElementById('login-paroquia').value;
  const campoSelect = document.getElementById('login-campo-usuario');
  const campoAdmin = document.getElementById('login-campo-usuario-admin');
  const carregando = document.getElementById('login-carregando');
  const sel = document.getElementById('login-usuario-select');
  document.getElementById('login-erro').style.display = 'none';

  if (!paroquia){ campoSelect.style.display='none'; campoAdmin.style.display='none'; return; }
  if (paroquia === '__admin__'){ campoSelect.style.display='none'; campoAdmin.style.display=''; return; }

  campoAdmin.style.display = 'none';
  campoSelect.style.display = '';
  sel.innerHTML = '<option value="">Selecione seu nome</option>';
  carregando.style.display = 'block';

  db.collection('agentes').where('paroquia','==',paroquia).get().then(snap=>{
    carregando.style.display = 'none';
    const usuarios = snap.docs.map(d=>d.data());
    if (!usuarios.length){ sel.innerHTML = '<option value="">Nenhum usuário cadastrado nesta paróquia</option>'; return; }
    usuarios.sort((a,b)=>{
      const ord = {admin:0, responsavel:1, agente:2};
      if (a.nivel!==b.nivel) return (ord[a.nivel]||9)-(ord[b.nivel]||9);
      return (a.nome||'').localeCompare(b.nome||'');
    });
    sel.innerHTML = '<option value="">Selecione seu nome</option>' +
      usuarios.map(u=>`<option value="${esc(u.usuario)}">${esc(u.nome)}${u.nivel==='responsavel'?' (Responsável)':''}</option>`).join('');
  }).catch(()=>{ carregando.style.display='none'; toast('Erro ao carregar usuários','erro'); });
}

function mostrarErroLogin(msg){
  const el = document.getElementById('login-erro');
  el.textContent = msg; el.style.display = 'block';
}

function fazerLogin(){
  const paroquia = document.getElementById('login-paroquia').value;
  const senha = document.getElementById('login-senha').value;
  if (!paroquia){ mostrarErroLogin('Selecione sua paróquia.'); return; }
  if (!senha){ mostrarErroLogin('Digite sua senha.'); return; }

  if (paroquia === '__admin__'){
    const usuario = document.getElementById('login-usuario-texto').value.trim();
    if (!usuario){ mostrarErroLogin('Digite o usuário.'); return; }
    const u = usuariosPadrao.find(u=>u.usuario===usuario && u.senha===senha);
    if (u){ iniciarSessao({...u}); return; }
    db.collection('agentes').where('usuario','==',usuario).where('nivel','==','admin').get().then(snap=>{
      if (!snap.empty){
        const doc = snap.docs[0].data();
        if (doc.senha === senha){ iniciarSessao({ id: snap.docs[0].id, ...doc }); return; }
      }
      mostrarErroLogin('Usuário ou senha incorretos.');
    }).catch(()=> mostrarErroLogin('Erro ao verificar credenciais.'));
    return;
  }

  const usuarioSel = document.getElementById('login-usuario-select').value;
  if (!usuarioSel){ mostrarErroLogin('Selecione seu nome.'); return; }

  db.collection('agentes').where('usuario','==',usuarioSel).where('paroquia','==',paroquia).get().then(snap=>{
    if (!snap.empty){
      const doc = snap.docs[0].data();
      if (doc.senha === senha){ iniciarSessao({ id: snap.docs[0].id, ...doc }); return; }
    }
    mostrarErroLogin('Senha incorreta.');
  }).catch(()=> mostrarErroLogin('Erro ao verificar credenciais.'));
}

function iniciarSessao(u){
  usuarioAtual = u;
  localStorage.setItem('df_sessao', JSON.stringify(u));
  document.getElementById('tela-login').style.display = 'none';
  document.getElementById('app-root').style.display = 'block';
  document.getElementById('tb-paroquia').textContent = u.paroquia === '__admin__' ? 'Diocese de Franca' : u.paroquia;
  telaAtual = 'home';
  iniciarListeners();
  render();
}

function doLogout(){
  if (!confirm('Deseja sair do sistema?')) return;
  localStorage.removeItem('df_sessao');
  [unsubFam,unsubEnt,unsubEst,unsubChat,unsubAgt,unsubComp].forEach(u=>{ if(u) u(); });
  usuarioAtual = null;
  document.getElementById('app-root').style.display = 'none';
  document.getElementById('tela-login').style.display = 'flex';
  document.getElementById('login-senha').value = '';
}

function atualizarDados(){ toast('Atualizando dados...'); location.reload(); }
function novaVersaoApp(){
  if (!confirm('Isso vai limpar o cache e recarregar o app com a versão mais recente. Continuar?')) return;
  if ('caches' in window){ caches.keys().then(names=>{ names.forEach(n=>caches.delete(n)); location.reload(true); }); }
  else location.reload(true);
}

/* Sessão salva (persiste com o mesmo login do sistema web, se mesmo domínio) */
(function tentarSessaoSalva(){
  try{
    const s = JSON.parse(localStorage.getItem('df_sessao')||'null');
    if (s && s.paroquia) iniciarSessao(s);
  }catch(e){ localStorage.removeItem('df_sessao'); }
})();

/* ================= LISTENERS FIREBASE ================= */
function iniciarListeners(){
  const qFam = isAdmin() ? db.collection('familias') : db.collection('familias').where('paroquia','==',minhaParoquia());
  unsubFam = qFam.onSnapshot(snap=>{
    familias = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, ()=> toast('Erro ao carregar famílias','erro'));

  const qEnt = isAdmin() ? db.collection('entregas') : db.collection('entregas').where('paroquia','==',minhaParoquia());
  unsubEnt = qEnt.onSnapshot(snap=>{
    entregas = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    render();
  }, ()=>{});

  unsubEst = db.collection('estoques').onSnapshot(snap=>{
    estoques = {};
    snap.docs.forEach(d=> estoques[d.id] = d.data());
    render();
  }, ()=>{});

  if (usuarioAtual.nivel !== 'agente'){
    const qAgt = isAdmin() ? db.collection('agentes') : db.collection('agentes').where('paroquia','==',minhaParoquia());
    unsubAgt = qAgt.onSnapshot(snap=>{
      agentes = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    }, ()=>{});
  }

  unsubChat = db.collection('chat').orderBy('ts','desc').limit(50).onSnapshot(snap=>{
    chatMsgs = snap.docs.map(d=>({id:d.id, ...d.data()})).reverse();
    render();
  }, ()=>{});

  const qComp = isAdmin() ? db.collection('compartilhamentos') : db.collection('compartilhamentos').where('paroquiaDestino','==',minhaParoquia());
  unsubComp = qComp.onSnapshot(snap=>{
    compartilhamentos = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
    render();
  }, ()=>{});
}

/* ================= NAVEGAÇÃO ================= */
function goTela(t){ telaAtual = t; selectedFamilyId = null; render(); window.scrollTo(0,0); document.getElementById('content').scrollTop=0; }
function goHistorico(){ goTela('historico'); }
function goAgentes(){ goTela('agentes'); }
function goPainelDiocese(){ goTela('painelDiocese'); }
function goChat(){ goTela('chat'); }
function goConfig(){ goTela('config'); }
function goMais(){ goTela('mais'); }
function goEntregas(){ entregaDestino='familia'; entregaSelFamiliaId=null; goTela('entregas'); }
function goNovaFamilia(){ goTela('novaFamilia'); }
function abrirFamilia(id){ selectedFamilyId = id; goTela('familyDetail'); }

/* ================= RENDER PRINCIPAL ================= */
function render(){
  document.getElementById('bottomnav').innerHTML = renderNav();
  document.getElementById('content').innerHTML = renderTela();
}

function navIcon(name){

function buscarCep(cep){
  const limpo = cep.replace(/\D/g,'');
  document.getElementById('nf-status').textContent = 'Buscando CEP...';
  fetch('https://viacep.com.br/ws/'+limpo+'/json/').then(r=>r.json()).then(d=>{
    if (d.erro){ document.getElementById('nf-status').textContent = 'CEP não encontrado.'; return; }
    document.getElementById('nf-rua').value = d.logradouro || '';
    document.getElementById('nf-bairro').value = d.bairro || '';
    document.getElementById('nf-cidade').value = (d.localidade||'') + (d.uf?'/'+d.uf:'');
    document.getElementById('nf-status').textContent = '';
  }).catch(()=>{ document.getElementById('nf-status').textContent = 'Não foi possível buscar o CEP.'; });
}

function salvarNovaFamilia(){
  const nome = document.getElementById('nf-nome').value.trim();
  const cpf = document.getElementById('nf-cpf').value.trim();
  const rua = document.getElementById('nf-rua').value.trim();
  const numero = document.getElementById('nf-numero').value.trim();
  if (!nome){ toast('Informe o nome.','erro'); return; }
  if (!cpf){ toast('Informe o CPF.','erro'); return; }
  if (!rua){ toast('Informe a rua.','erro'); return; }
  if (!numero){ toast('Informe o número.','erro'); return; }

  const paroquiaSelEl = document.getElementById('nf-paroquia');
  const paroquia = paroquiaSelEl ? paroquiaSelEl.value : minhaParoquia();
  const endereco = rua + ', ' + numero;

  const dados = {
    nome, cpf, endereco, numero,
    bairro: document.getElementById('nf-bairro').value.trim(),
    cidade: document.getElementById('nf-cidade').value.trim(),
    telefone: document.getElementById('nf-telefone').value.trim(),
    pessoas: parseInt(document.getElementById('nf-pessoas').value)||1,
    obs: document.getElementById('nf-obs').value.trim(),
    paroquia, inativo: false, criadoEm: new Date().toISOString()
  };

  toast('Verificando cadastro...');
  const cpfNorm = cpf.replace(/\D/g,'');
  db.collection('familias').where('cpf','==',cpf).get().then(snap=>{
    const dup = snap.docs.find(d=>!d.data().inativo);
    if (dup){ toast('Já existe uma família ativa com esse CPF: '+dup.data().nome, 'erro'); return; }

    // Checar famílias na mesma rua, em QUALQUER paróquia — pode indicar
    // a mesma família tentando se cadastrar em mais de um lugar para
    // receber mais de uma cesta.
    db.collection('familias').orderBy('endereco').startAt(rua).endAt(rua + '\uf8ff').get()
      .then(snapViz => verificarVizinhosMesmaRua(snapViz.docs.map(d=>({id:d.id, ...d.data()})), dados, cpfNorm, numero))
      .catch(() => finalizarSalvarFamilia(dados)); // fallback se índice não existir ainda
  }).catch(e=> toast('Erro: '+e.message,'erro'));
}

function verificarVizinhosMesmaRua(lista, dados, cpfNorm, numero){
  const vizinhos = lista.filter(f=>{
    if (f.inativo) return false;
    if (f.cpf && f.cpf.replace(/\D/g,'') === cpfNorm) return false;
    return (f.numero||'') !== numero;
  });
  if (!vizinhos.length){ finalizarSalvarFamilia(dados); return; }

  const listaTexto = vizinhos.slice(0,5).map(v=>`• ${v.nome} — nº ${v.numero||'?'} (${v.paroquia})`).join('\n');
  const ok = confirm(
    '⚠️ Atenção — Mesma rua\n\n' +
    `Encontramos ${vizinhos.length} família(s) cadastrada(s) na mesma rua com número diferente, ` +
    'inclusive em outras paróquias — isso pode indicar a mesma família tentando se cadastrar em mais ' +
    'de um lugar para receber mais de uma cesta:\n\n' + listaTexto +
    '\n\nOs nomes serão adicionados às observações do cadastro. Deseja continuar mesmo assim?'
  );
  if (!ok){ toast('Cadastro cancelado.'); return; }

  const obsVizinhos = vizinhos.map(v=>`Vizinho na mesma rua: ${v.nome} (nº ${v.numero||'?'}, ${v.paroquia})`).join('; ');
  dados.obs = dados.obs ? dados.obs + ' | ' + obsVizinhos : obsVizinhos;
  finalizarSalvarFamilia(dados);
}

function finalizarSalvarFamilia(dados){
  if (dados.id){
    const id = dados.id; delete dados.id;
    db.collection('familias').doc(id).update(dados).then(()=>{
      toast('Família atualizada!','ok');
      goTela('familias');
    }).catch(e=> toast('Erro ao salvar: '+e.message,'erro'));
    return;
  }
  db.collection('familias').add(dados).then(()=>{
    toast('Família cadastrada!','ok');
    goTela('familias');
  }).catch(e=> toast('Erro ao salvar: '+e.message,'erro'));
}

function confirmarEntregaFamilia(){
  const f = familias.find(x=>x.id===entregaSelFamiliaId);
  if (!f){ toast('Selecione uma família.','erro'); return; }
  const entrega = {
    familiaId: f.id, familiaNome: f.nome, familiaCpf: f.cpf, paroquia: f.paroquia,
    data: new Date().toISOString().slice(0,10),
    responsavel: usuarioAtual.nome || usuarioAtual.usuario,
    origem: entregaOrigemTipo, obs: ''
  };
  db.collection('entregas').add(entrega).then(()=>{
    const e = estoques[f.paroquia] || {};
    const novoSaldo = Math.max(0, (e.saldo||0) - 1);
    db.collection('estoques').doc(f.paroquia).set({ ...e, saldo: novoSaldo, ultimaAtualizacao: new Date().toISOString().slice(0,10) }).catch(()=>{});
    toast('Entrega registrada! ✅','ok');
    entregaSelFamiliaId = null;
    goTela('home');
  }).catch(e=> toast('Erro: '+e.message,'erro'));
}

function confirmarDestinacaoParoquia(){
  const origem = entregaOrigemParoquia || minhaParoquia();
  const destino = document.getElementById('ep-destino').value;
  const qtd = parseInt(document.getElementById('ep-qtd').value);
  const data = document.getElementById('ep-data').value;
  const obs = document.getElementById('ep-obs').value.trim();
  if (!destino){ toast('Selecione a paróquia de destino.','erro'); return; }
  if (!qtd || qtd<1){ toast('Informe a quantidade.','erro'); return; }
  if (!data){ toast('Informe a data.','erro'); return; }

  const eOrigem = estoques[origem] || {};
  const eDestino = estoques[destino] || {};
  const novoSaldoOrigem = Math.max(0, (eOrigem.saldo||0) - qtd);
  const novoSaldoDestino = (eDestino.saldo||0) + qtd;

  const registro = {
    paroquiaOrigem: origem, paroquiaDestino: destino, quantidade: qtd, data, obs,
    responsavel: usuarioAtual.nome || usuarioAtual.usuario, criadoEm: new Date().toISOString()
  };

  Promise.all([
    db.collection('estoques').doc(origem).set({ ...eOrigem, saldo: novoSaldoOrigem, ultimaAtualizacao: data }),
    db.collection('estoques').doc(destino).set({ ...eDestino, saldo: novoSaldoDestino, ultimaAtualizacao: data }),
    db.collection('compartilhamentos').add(registro)
  ]).then(()=>{
    toast('Cestas destinadas com sucesso!','ok');
    goTela('home');
  }).catch(e=> toast('Erro: '+e.message,'erro'));
}

            <div style="font-size:13.5px;font-weight:600;color:var(--accent);">+${c.quantidade}</div>

function definirCompartilhavel(){
  const qtd = parseInt(document.getElementById('est-comp-qtd').value);
  if (qtd == null || isNaN(qtd) || qtd < 0){ toast('Informe uma quantidade válida.','erro'); return; }
  const par = minhaParoquia();
  const e = estoques[par] || {};
  if (qtd > (e.saldo||0)){ toast('Você não pode compartilhar mais do que tem em estoque.','erro'); return; }
  db.collection('estoques').doc(par).set({ ...e, compartilhavel: qtd, ultimaAtualizacaoComp: new Date().toISOString().slice(0,10), responsavelComp: usuarioAtual.nome||usuarioAtual.usuario })
    .then(()=> toast('Disponível para compartilhar atualizado!','ok'))
    .catch(err=> toast('Erro: '+err.message,'erro'));
}

function solicitarCompartilhado(paroquiaOrigem, disponivel){
  const qtdStr = prompt(`Quantas cestas você quer solicitar de "${paroquiaOrigem}"? (disponível: ${disponivel})`);
  if (qtdStr === null) return;
  const qtd = parseInt(qtdStr);
  if (!qtd || qtd < 1){ toast('Quantidade inválida.','erro'); return; }
  if (qtd > disponivel){ toast('Quantidade maior que o disponível.','erro'); return; }

  const destino = minhaParoquia();
  const eOrigem = estoques[paroquiaOrigem] || {};
  const eDestino = estoques[destino] || {};
  const data = new Date().toISOString().slice(0,10);

  Promise.all([
    db.collection('estoques').doc(paroquiaOrigem).set({
      ...eOrigem,
      saldo: Math.max(0, (eOrigem.saldo||0) - qtd),
      compartilhavel: Math.max(0, (eOrigem.compartilhavel||0) - qtd),
      ultimaAtualizacao: data
    }),
    db.collection('estoques').doc(destino).set({ ...eDestino, saldo: (eDestino.saldo||0)+qtd, ultimaAtualizacao: data }),
    db.collection('compartilhamentos').add({
      paroquiaOrigem, paroquiaDestino: destino, quantidade: qtd, data,
      obs: 'Solicitado do disponível para compartilhar',
      responsavel: usuarioAtual.nome || usuarioAtual.usuario, criadoEm: new Date().toISOString()
    })
  ]).then(()=> toast('Cestas recebidas com sucesso!','ok'))
    .catch(e=> toast('Erro: '+e.message,'erro'));
}

function adicionarEstoque(){
  const qtd = parseInt(document.getElementById('est-add-qtd').value);
  if (!qtd || qtd<1){ toast('Informe uma quantidade válida.','erro'); return; }
  const par = minhaParoquia();
  const e = estoques[par] || {};
  db.collection('estoques').doc(par).set({ ...e, saldo:(e.saldo||0)+qtd, ultimaAtualizacao: new Date().toISOString().slice(0,10) })
    .then(()=> toast('Estoque atualizado!','ok'))
    .catch(err=> toast('Erro: '+err.message,'erro'));
}

/* ================= HISTÓRICO ================= */
function renderHistorico(){
  const meses = [...new Set(entregas.map(e=>(e.data||'').slice(0,7)))].filter(Boolean).sort().reverse();
  const combinados = [
    ...entregas.map(e=>({tipo:'familia', data:e.data, destino:e.familiaNome, origem:e.origem==='compartilhada'?'Cesta compartilhada':'Estoque próprio'})),
    ...compartilhamentos.map(c=>({tipo:'paroquia', data:c.data, destino:c.paroquiaDestino, origem:'Destinação a paróquia ('+c.quantidade+')'}))
  ].filter(h=> !historicoFiltroMes || (h.data||'').slice(0,7)===historicoFiltroMes)
   .sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  return `
  <div class="section col" style="gap:14px;">
    <div class="backrow"><div class="backbtn" onclick="goMais()">${backIcon()}</div><h1 class="serif" style="margin:0;font-size:18px;">Histórico de Entregas</h1></div>
    <select onchange="historicoFiltroMes=this.value; render();">
      <option value="">Todos os meses</option>
      ${meses.map(m=>`<option value="${m}" ${m===historicoFiltroMes?'selected':''}>${m}</option>`).join('')}
    </select>
    <div class="col" style="gap:8px;">
      ${combinados.length ? combinados.map(h=>`
        <div class="card row" style="align-items:center;gap:12px;">
          <div class="avatar" style="width:32px;height:32px;font-size:11px;">${esc(initialsOf(h.destino))}</div>
          <div class="col" style="flex:1;gap:1px;"><div style="font-size:13.5px;font-weight:600;">${esc(h.destino)}</div><div style="font-size:11.5px;color:var(--text-3);">${fmtData(h.data)} · ${esc(h.origem)}</div></div>
        </div>`).join('') : '<div class="card" style="text-align:center;color:var(--text-3);">Nenhum registro.</div>'}
    </div>
  </div>`;
}

function salvarNovoAgente(){

  const nivelEl = document.getElementById('na-nivel');
  const nivel = nivelEl ? nivelEl.value : 'agente';
  const paroquiaEl = document.getElementById('na-paroquia');
  const paroquia = isAdmin() ? paroquiaEl.value : minhaParoquia();

  db.collection('agentes').where('usuario','==',usuario).get().then(snap=>{

      toast('Usuário cadastrado!','ok'); goTela('agentes');

  const linhas = Object.entries(porParoquia).sort((a,b)=>b[1].familias-a[1].familias);

}

  return `
  <div class="col" style="height:calc(100vh - 130px);">
    <div class="backrow" style="padding:0 18px;margin-top:18px;"><div class="backbtn" onclick="goMais()">${backIcon()}</div><h1 class="serif" style="margin:0;font-size:18px;">Chat Geral</h1></div>
    <div class="col" id="chat-box" style="flex:1;gap:9px;padding:12px 18px;overflow-y:auto;">
      ${chatMsgs.length ? chatMsgs.map(m=>`
        <div class="col" style="gap:2px;max-width:82%;align-self:${m.paroquia===minhaParoquia()?'flex-end':'flex-start'};background:${m.paroquia===minhaParoquia()?'var(--accent-bg)':'var(--card)'};border:1px solid var(--border);border-radius:14px;padding:9px 12px;">
          <div style="font-size:11.5px;font-weight:600;color:var(--accent);">${esc(m.usuario||'')}</div>
          <div style="font-size:13.5px;">${esc(m.texto||'')}</div>
        </div>`).join('') : '<div style="color:var(--text-3);font-size:13px;text-align:center;">Nenhuma mensagem ainda.</div>'}
    </div>
    <div class="row" style="gap:8px;padding:10px 18px 16px;border-top:1px solid var(--border);">
      <input type="text" id="chat-input" placeholder="Digite uma mensagem..." onkeypress="if(event.key==='Enter') enviarMensagemChat();">
      <button class="btn-primary" style="width:46px;padding:0;flex:0 0 auto;" onclick="enviarMensagemChat()">➤</button>
    </div>
  </div>`;
}
function enviarMensagemChat(){
  const input = document.getElementById('chat-input');
  const texto = input.value.trim();
  if (!texto) return;
  db.collection('chat').add({ texto, usuario: usuarioAtual.nome||usuarioAtual.usuario, paroquia: minhaParoquia(), ts: new Date().toISOString() })
    .then(()=>{ input.value=''; })
    .catch(e=> toast('Erro: '+e.message,'erro'));
}

/* ================= CONFIG ================= */
function renderConfig(){
  const podeTrocarSenha = !!usuarioAtual.id;
  return `
  <div class="section col" style="gap:16px;">
    <div class="backrow"><div class="backbtn" onclick="goMais()">${backIcon()}</div><h1 class="serif" style="margin:0;font-size:18px;">Configurações</h1></div>
    <div class="grouped">
      <div class="list-item row" style="align-items:center;justify-content:space-between;${podeTrocarSenha?'cursor:pointer;':'opacity:.5;'}" ${podeTrocarSenha?'onclick="alterarSenha()"':''}>
        <span style="font-size:14px;">Alterar senha</span>${backIconRight()}
      </div>
      <div class="list-item row" style="align-items:center;gap:10px;cursor:pointer;" onclick="atualizarDados()">
        <span style="flex:1;font-size:14px;">Atualizar dados</span>
      </div>
      <div class="list-item row" style="align-items:center;gap:10px;cursor:pointer;" onclick="novaVersaoApp()">
        <span style="flex:1;font-size:14px;">Nova versão do app</span>
        <span class="badge" style="background:var(--accent-bg);color:var(--accent);">v1.0</span>
      </div>
      <div class="list-item row" style="justify-content:space-between;">
        <span style="font-size:14px;">Sobre o Panis</span>
        <span style="font-size:12px;color:var(--text-3);">App mobile</span>
      </div>
    </div>
  </div>`;
}
function alterarSenha(){
  if (!usuarioAtual.id){ toast('Este usuário padrão não pode trocar a senha por aqui.','erro'); return; }
  const atual = prompt('Digite sua senha atual:');
  if (atual === null) return;
  if (atual !== usuarioAtual.senha){ toast('Senha atual incorreta.','erro'); return; }
  const nova = prompt('Digite a nova senha (mín. 4 caracteres):');
  if (nova === null) return;
  if (nova.length < 4){ toast('A nova senha precisa ter ao menos 4 caracteres.','erro'); return; }
  db.collection('agentes').doc(usuarioAtual.id).update({ senha: nova }).then(()=>{
    usuarioAtual.senha = nova;
    localStorage.setItem('df_sessao', JSON.stringify(usuarioAtual));
    toast('Senha alterada!','ok');
  }).catch(e=> toast('Erro: '+e.message,'erro'));
}

/* Rota extra para tela de novo agente (fora do switch principal por simplicidade) */
const _origRenderTela = renderTela;
renderTela = function(){
  if (telaAtual === 'novoAgente') return renderNovoAgente();
  return _origRenderTela();
};
</script>
</body>
